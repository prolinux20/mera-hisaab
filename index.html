<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Hisaab</title>
    
    <!-- Mobile App Settings (Add to Home Screen fix) -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="application-name" content="Hisaab">
    <meta name="theme-color" content="#4f46e5">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
        
        body { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            color: #2d3748;
        }

        .glass { 
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(15px); 
            border-radius: 24px; 
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .input-focus:focus {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(79, 70, 229, 0.2);
        }

        .expense-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .expense-card:hover {
            transform: scale(1.02);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 10px; }
    </style>
</head>
<body class="p-4">

    <div class="max-w-md mx-auto pt-6">
        <!-- Header Section -->
        <div class="glass p-8 mb-6 text-center animate__animated animate__fadeInDown">
            <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-purple-600">
                Mera Hisaab 💰
            </h1>
            <p class="text-gray-500 text-sm mt-1">Total Kharcha</p>
            <div class="mt-2 text-4xl font-extrabold text-indigo-700" id="totalAmount">₹0</div>
            
            <!-- Progress Bar -->
            <div class="w-full bg-gray-200 rounded-full h-1.5 mt-4">
                <div id="progressBar" class="bg-indigo-600 h-1.5 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
        </div>

        <!-- Input Section -->
        <div class="glass p-6 mb-6 animate__animated animate__fadeInUp">
            <div class="space-y-4">
                <div>
                    <input type="text" id="itemName" placeholder="Item ka naam (e.g. Petrol)" 
                        class="w-full p-4 rounded-2xl border-0 bg-gray-100 input-focus outline-none transition-all text-lg">
                    <p id="suggestion" class="text-red-500 text-xs mt-2 hidden animate__animated animate__headShake">
                        ⚡ Yeh pehle se list mein hai!
                    </p>
                </div>
                
                <div>
                    <input type="number" id="itemAmount" placeholder="Amount ₹" 
                        class="w-full p-4 rounded-2xl border-0 bg-gray-100 input-focus outline-none transition-all text-lg">
                </div>

                <button onclick="addItem()" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-2xl hover:bg-indigo-700 transition-all active:scale-95 shadow-lg shadow-indigo-200 text-lg">
                    Add Kharcha +
                </button>
            </div>
        </div>

        <!-- List Section -->
        <div class="flex justify-between items-center mb-4 px-2">
            <h2 class="text-white font-semibold">History</h2>
            <button onclick="clearAll()" class="text-white/70 text-xs underline">Clear All</button>
        </div>
        
        <div id="expenseList" class="space-y-4 pb-10">
            <!-- Items added here -->
        </div>
    </div>

    <script>
        let expenses = JSON.parse(localStorage.getItem('smartHisaab')) || [];
        const itemNameInput = document.getElementById('itemName');
        const suggestionMsg = document.getElementById('suggestion');

        // Check for Duplicate
        itemNameInput.addEventListener('input', () => {
            const val = itemNameInput.value.trim().toLowerCase();
            const isDuplicate = expenses.some(ex => ex.name.toLowerCase() === val);
            if (isDuplicate && val !== "") {
                suggestionMsg.classList.remove('hidden');
            } else {
                suggestionMsg.classList.add('hidden');
            }
        });

        function addItem() {
            const name = itemNameInput.value.trim();
            const amount = parseFloat(document.getElementById('itemAmount').value);

            if (!name || !amount) return;

            const newExpense = {
                id: Date.now(),
                name: name,
                amount: amount,
                date: new Date().toLocaleDateString('en-IN', { day:'numeric', month:'short' })
            };

            expenses.unshift(newExpense);
            updateApp();
            
            // Reset fields
            itemNameInput.value = '';
            document.getElementById('itemAmount').value = '';
        }

        function deleteItem(id) {
            expenses = expenses.filter(ex => ex.id !== id);
            updateApp();
        }

        function clearAll() {
            if(confirm("Sara hisaab mita dein?")) {
                expenses = [];
                updateApp();
            }
        }

        function updateApp() {
            localStorage.setItem('smartHisaab', JSON.stringify(expenses));
            render();
        }

        function render() {
            const list = document.getElementById('expenseList');
            const totalDisplay = document.getElementById('totalAmount');
            const progressBar = document.getElementById('progressBar');
            let total = 0;

            list.innerHTML = '';
            expenses.forEach((ex, index) => {
                total += ex.amount;
                list.innerHTML += `
                    <div class="glass p-5 flex justify-between items-center animate__animated animate__fadeInLeft" style="animation-delay: ${index * 0.1}s">
                        <div>
                            <h3 class="font-bold text-gray-800 text-lg">${ex.name}</h3>
                            <span class="text-xs text-gray-400 font-medium uppercase tracking-wider">${ex.date}</span>
                        </div>
                        <div class="flex items-center gap-4">
                            <span class="text-xl font-bold text-indigo-600">₹${ex.amount}</span>
                            <button onclick="deleteItem(${ex.id})" class="h-10 w-10 flex items-center justify-center rounded-full bg-red-50 text-red-500 hover:bg-red-500 hover:text-white transition-all">
                                ✕
                            </button>
                        </div>
                    </div>
                `;
            });

            totalDisplay.innerText = `₹${total.toLocaleString('en-IN')}`;
            // Progress bar logic (max 10,000 for visual)
            let progress = (total / 10000) * 100;
            progressBar.style.width = Math.min(progress, 100) + '%';
        }

        render();
    </script>
</body>
</html>
